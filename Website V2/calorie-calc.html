<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cal calc</title>
    <!-- Bootstrap -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
      rel="stylesheet" />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet" />
    <!-- CSS -->
    <link href="allPages.css" rel="stylesheet" />
    <!-- Javascript -->
    <script src="cal-calcJS.js" defer></script>

    <style>
      .calc-bg {
        background-color: #252525;
        border: 1px solid #2e2e2e;
        border-radius: 10px;
        padding: 24px;
        max-width: 400px;
        width: 100%;
        margin:2% auto
  
      }

      .calc-bg h2 {
        margin: 0 0 20px 0;
        color: #f2f2f2;
      }

      .form-group {
        margin-bottom: 16px;
      }

      .form-group label {
        margin-bottom: 6px;
        font-size: 0.9rem;
        color: #f2f2f2;
      }

      .form-group input,
      .form-group select {
        width: 100%;
        padding: 10px;
        background-color: #222222;
        border: 1px solid #2e2e2e;
        border-radius: 6px;
        color: #f2f2f2;
        font-size: 1rem;
      }

      .form-group input:focus,
      .form-group select:focus {
        outline: 1px solid #a1ea93;
      }

      button {
        width: 100%;
        padding: 12px;
        background-color: #a1ea93;
        color: #1c1c1c;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        font-size: 1rem;
        cursor: pointer;
        margin-top: 8px;
      }

      button:hover {
        opacity: 0.9;
      }

      .ans {
        margin-top: 20px;
        padding: 16px;
        background-color: #222222;
        border: 1px solid #2e2e2e;
        border-radius: 6px;
      }

      .ans.hidden {
        display: none;
      }

      .ans-value {
        font-size: 1.6rem;
        font-weight: bold;
        color: #a1ea93;
      }

      .error-text {
        color: #ff6b6b;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <!-- MAIN NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold text-uppercase" href="home.html">
          <span class="green-txt">lettuce</span>befit
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
          data-bs-target="#mainNavbar">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
            <li class="nav-item"><a class="nav-link"
                href="home.html">Home</a></li>
            <li class="nav-item"><a class="nav-link "
                href="workouts.html">Workouts</a></li>
            <li class="nav-item"><a class="nav-link active"
                href="cal-calc.html">Calorie Calculator</a></li>
          </ul>
          <a class="btn btn-cta" href="join.html">Join Us</a>
        </div>
      </div>
    </nav>

    <!-- CALCULATOR -->
    <div class="calc-bg">
      <h2>Calorie Calculator</h2>

      <div class="form-group">
        <label for="gender">Gender</label>
        <select id="gender">
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>

      <div class="form-group">
        <label for="age">Age (years)</label>
        <input type="number" id="age" placeholder="25" min="1" max="120">
      </div>

      <div class="form-group">
        <label for="height">Height (cm)</label>
        <input type="number" id="height" placeholder="175" min="1">
      </div>

      <div class="form-group">
        <label for="weight">Weight (kg)</label>
        <input type="number" id="weight" placeholder="70" min="1">
      </div>

      <div class="form-group">
        <label for="activity">Activity Level</label>
        <select id="activity">
          <option value="1.2">Sedentary (little or no exercise)</option>
          <option value="1.375">Lightly Active (1-3 days/week)</option>
          <option value="1.55">Moderately Active (3-5 days/week)</option>
          <option value="1.725">Very Active (6-7 days/week)</option>
          <option value="1.9">Extra Active (intense job/exercise)</option>
        </select>
      </div>

      <a href="#ans"><button onclick="calorieCalc()">Calculate</button></a>

      <div id="ans" class="ans hidden"></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
